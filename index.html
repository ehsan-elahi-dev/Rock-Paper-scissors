<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A modern Rock Paper Scissors game built with JavaScript and Tailwind CSS."
    />
    <title>Rock Paper Scissors</title>
  </head>

  <body class="min-h-screen bg-slate-950 text-white">
    <div
      class="min-h-screen bg-[radial-gradient(circle_at_top,#1e293b_0%,#020617_45%,#020617_100%)]"
    >
      <header
        class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-5 sm:py-5 lg:py-4"
      >
        <div>
          <p class="text-sm font-semibold tracking-[0.3em] text-cyan-400">RPS</p>
          <p class="text-[10px] tracking-widest text-slate-400 sm:text-xs">Game Play</p>
        </div>

        <div
          class="flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-2"
        >
          <span class="h-2 w-2 animate-pulse rounded-full bg-green-400"></span>
          <span class="text-[10px] font-medium text-slate-300 sm:text-xs"> ONLINE </span>
        </div>
      </header>

      <main class="mx-auto max-w-5xl px-4 pb-8 pt-5 sm:px-5 sm:pt-7 lg:pb-6 lg:pt-5">
        <section class="text-center">
          <p
            class="mb-2 text-xs font-medium uppercase tracking-[0.3em] text-cyan-400 sm:text-sm lg:mb-3"
          >
            Classic Battle
          </p>

          <h1 class="text-3xl font-black tracking-tight sm:text-5xl md:text-6xl">
            Rock Paper Scissors
          </h1>

          <p
            class="mx-auto mt-2 max-w-xl text-xs leading-5 text-slate-400 sm:mt-3 sm:text-base sm:leading-6"
          >
            Make your move, challenge the computer, and prove your strategy.
          </p>
        </section>

        <section
          class="mx-auto mt-6 max-w-2xl rounded-3xl border border-white/10 bg-white/5 p-4 shadow-2xl backdrop-blur-xl sm:mt-8 sm:p-5 lg:mt-6"
        >
          <div class="grid grid-cols-3 items-center text-center">
            <div>
              <p class="text-[10px] uppercase tracking-widest text-slate-400 sm:text-xs">You</p>
              <p id="player-score" class="mt-1 text-3xl font-black sm:mt-2 sm:text-4xl">0</p>
            </div>

            <div>
              <p class="text-xs font-bold tracking-widest text-cyan-400">VS</p>
            </div>

            <div>
              <p class="text-[10px] uppercase tracking-widest text-slate-400 sm:text-xs">
                Computer
              </p>
              <p id="computer-score" class="mt-1 text-3xl font-black sm:mt-2 sm:text-4xl">0</p>
            </div>
          </div>
        </section>

        <section
          class="mx-auto mt-5 max-w-3xl rounded-3xl border border-white/10 bg-slate-900/70 p-3 shadow-2xl backdrop-blur-xl sm:mt-7 sm:p-6 lg:mt-6"
        >
          <div class="grid grid-cols-2 gap-2.5 sm:gap-5">
            <div class="rounded-2xl border border-white/10 bg-white/5 p-3 text-center sm:p-5">
              <p class="text-[9px] uppercase tracking-widest text-slate-400 sm:text-xs">
                Your Choice
              </p>

              <div
                id="player-choice"
                class="mt-3 flex h-14 items-center justify-center text-5xl sm:mt-4 sm:h-20 sm:text-6xl"
              >
                ❔
              </div>
            </div>

            <div class="rounded-2xl border border-white/10 bg-white/5 p-3 text-center sm:p-5">
              <p class="text-[9px] uppercase tracking-widest text-slate-400 sm:text-xs">
                Computer Choice
              </p>

              <div
                id="computer-choice"
                class="mt-3 flex h-14 items-center justify-center text-5xl sm:mt-4 sm:h-20 sm:text-6xl"
              >
                ❔
              </div>
            </div>
          </div>

          <div class="mt-4 text-center sm:mt-6">
            <p class="text-[10px] uppercase tracking-widest text-slate-500 sm:text-sm">Result</p>

            <h2 id="result-text" class="mt-1 text-lg font-bold sm:mt-2 sm:text-2xl">
              Make your move
            </h2>
          </div>
        </section>

        <section class="mx-auto mt-5 max-w-3xl sm:mt-7 lg:mt-6">
          <p class="mb-3 text-center text-xs font-medium text-slate-400 sm:mb-4 sm:text-sm">
            Choose your move
          </p>

          <div class="grid grid-cols-3 gap-2 sm:gap-5">
            <button
              data-choice="rock"
              class="choice group rounded-2xl border border-white/10 bg-white/5 p-3 transition-all duration-200 hover:-translate-y-1 hover:border-cyan-400/50 hover:bg-cyan-400/10 active:scale-95 sm:p-6"
            >
              <span class="block transition group-hover:scale-110">
                <img
                  src="/src/assets/rock.svg"
                  alt="Rock"
                  class="mx-auto h-11 w-11 object-contain sm:h-20 sm:w-20"
                />
              </span>

              <span class="mt-2 block text-[11px] font-semibold sm:mt-3 sm:text-sm"> Rock </span>
            </button>

            <button
              data-choice="paper"
              class="choice group rounded-2xl border border-white/10 bg-white/5 p-3 transition-all duration-200 hover:-translate-y-1 hover:border-cyan-400/50 hover:bg-cyan-400/10 active:scale-95 sm:p-6"
            >
              <span class="block transition group-hover:scale-110">
                <img
                  src="/src/assets/paper.svg"
                  alt="Paper"
                  class="mx-auto h-11 w-11 object-contain sm:h-20 sm:w-20"
                />
              </span>

              <span class="mt-2 block text-[11px] font-semibold sm:mt-3 sm:text-sm"> Paper </span>
            </button>

            <button
              data-choice="scissors"
              class="choice group rounded-2xl border border-white/10 bg-white/5 p-3 transition-all duration-200 hover:-translate-y-1 hover:border-cyan-400/50 hover:bg-cyan-400/10 active:scale-95 sm:p-6"
            >
              <span class="block transition group-hover:scale-110">
                <img
                  src="/src/assets/scissors.svg"
                  alt="Scissors"
                  class="mx-auto h-11 w-11 object-contain sm:h-20 sm:w-20"
                />
              </span>

              <span class="mt-2 block text-[11px] font-semibold sm:mt-3 sm:text-sm">
                Scissors
              </span>
            </button>
          </div>

          <div class="mt-4 text-center sm:mt-5">
            <button
              id="reset-game"
              class="rounded-xl border border-white/10 bg-white/5 px-5 py-2.5 text-sm font-semibold transition-all duration-200 hover:bg-white/10 sm:px-6 sm:py-3"
            >
              Reset Game
            </button>
          </div>
        </section>
      </main>

      <footer class="border-t border-white/5 py-4 sm:py-5">
        <p class="text-center text-[10px] text-slate-500 sm:text-xs">
          Built with HTML, Tailwind CSS & JavaScript
        </p>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
